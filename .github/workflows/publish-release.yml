name: Publish release

# Publishes a release as soon as its Release run has built every platform and
# added SHA256SUMS.txt: previews (v0.* and tags with a suffix such as
# v1.1.0-rc.1) were created as pre-releases and stay so, other tags become the
# latest release. A workflow of its own, because a workflow_run workflow always
# runs as main defines it, also for a tag on an older commit.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          BUILT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # After a tag is moved to a fix, only the run for its new commit publishes.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$tagged" != "$BUILT" ]; then
            echo "$TAG now points at $tagged, not at the $BUILT this run built; skipping."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
