name: Release

# Pushing a tag such as v1.0.0 builds every platform (plus the Google Play
# bundle) into a draft GitHub release; once everything is uploaded,
# publish-release.yml publishes it. Previews (v0.* and tags with a suffix such
# as v1.1.0-rc.1) are pre-releases. The notes come from
# docs/yohaku/release-notes/<tag>.md when it exists.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag must be on the commit that sets its version (a preview's
          # suffix aside): a tag pushed before that commit would build the
          # previous version under the new name.
          version=$(jq -r .version apps/readest-app/package.json)
          if [ "${TAG%%-*}" != "v$version" ]; then
            echo "::error::$TAG is on a commit whose package.json says $version."
            exit 1
          fi
          notes="docs/yohaku/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            notes="$RUNNER_TEMP/notes.md"
            printf '%s\n' \
              'Yohaku 预览版 / preview build.' \
              '' \
              '- macOS：未经 Apple 公证。首次打开如被拦截，请到「系统设置 → 隐私与安全性」点击「仍要打开」。' \
              '- Windows：可能出现 SmartScreen 提示，选择「更多信息 → 仍要运行」。' \
              '- Android：安装 arm64（大多数手机）或 armv7（较旧的 32 位手机）的 APK；.aab 供 Google Play 使用。' \
              '- 校验文件完整性：SHA256SUMS.txt。' > "$notes"
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "Release $TAG already exists; the builds upload into it."
            # A tag moved to a new commit: its draft takes that commit's notes.
            if [ "$draft" = true ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
            fi
            exit 0
          fi
          prerelease=()
          case "$TAG" in v0.* | *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" \
            --title "Yohaku $TAG" --notes-file "$notes"

  build:
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-app.yml
    with:
      release_tag: ${{ github.ref_name }}
      aab: true
    secrets: inherit

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: add SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --pattern 'Yohaku_*'
          (cd assets && sha256sum Yohaku_* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
