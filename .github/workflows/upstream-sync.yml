name: Upstream sync

# Once a month, or by hand, merges Readest's latest release into a branch
# upstream-sync/<version> and reports the result in an issue. Finishing the
# merge (conflicts, the [yohaku] patches, real-device checks) is done by hand:
# see docs/yohaku/upstream-patches.md.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: merge the latest Readest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/readest/readest.git
          # Readest's tags go under upstream/ so they never meet Yohaku's own v0.0.x.
          git fetch --no-tags upstream '+refs/tags/v*:refs/tags/upstream/v*'
          tag=$(git tag -l 'upstream/v*' | grep -E '^upstream/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1)
          version=${tag#upstream/}
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "main already contains Readest $version."
            exit 0
          fi
          title="Merge Readest $version"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" != 0 ]; then
            echo "An issue for Readest $version is open already."
            exit 0
          fi
          branch="upstream-sync/$version"
          git switch -c "$branch"
          if git merge --no-edit -m "Merge Readest $version" "$tag"; then
            git push origin "$branch"
            body=$(printf '%s\n' \
              "Readest $version merges into main without conflicts; the result is on the branch \`$branch\`." \
              '' \
              '1. Check the changes against docs/yohaku/upstream-patches.md (every [yohaku] patch still in place).' \
              '2. Merge the branch into main and push: CI and the test builds run on main.' \
              '3. Check the test builds on real devices before tagging a release.')
          else
            conflicts=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort
            body=$(printf '%s\n' \
              "Merging Readest $version into main stops on conflicts:" \
              '' \
              "$conflicts" \
              '' \
              'Resolve them by hand: `git fetch upstream --tags`, then merge the release tag into main,' \
              'keeping every patch listed in docs/yohaku/upstream-patches.md.')
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
