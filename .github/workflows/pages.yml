# Builds the documentation site (website/, VitePress) and publishes it to GitHub Pages at
# https://chaosnap.github.io/Yohaku/. The site reads the development documents and the release
# notes from docs/yohaku, and its pictures from assets-src/icon and docs/screenshots.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets-src/icon/**'
      - '.github/workflows/pages.yml'
  # Once a release is published its tag exists, and the changelog can show the release's date.
  workflow_run:
    workflows: [Publish release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The tags give each release in the changelog its date.
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24

      # The versions are pinned in website/package.json; nothing is installed locally, so there is
      # no lockfile to install from.
      - name: Install VitePress
        working-directory: website
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Build
        working-directory: website
        run: npm run docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
