name: CI

# Fast checks on every push and pull request. Platform builds live in build.yml.
on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]

# Pinned to Ubuntu 24.04: ubuntu-latest moved to 26.04, which Playwright 1.60
# cannot install Chromium on yet.
permissions:
  contents: read

env:
  # Next.js CLI usage telemetry (build-time, not in the app).
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Format, lint, offline check and frontend build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gstack is a skill pack for Readest's agents; nothing builds from it.
      - name: initialize git submodules
        run: git -c submodule."apps/readest-app/.claude/skills/gstack".update=none submodule update --init --recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: check the Yohaku configuration
        run: node scripts/yohaku/check-yohaku-config.mjs

      - name: install dependencies
        working-directory: apps/readest-app
        run: pnpm install --frozen-lockfile --prefer-offline && pnpm setup-vendors

      - name: format check
        run: bash scripts/yohaku/run-logged.sh bash -c 'pnpm format:check || (pnpm format && git diff && exit 1)'

      - name: lint
        working-directory: apps/readest-app
        run: bash ../../scripts/yohaku/run-logged.sh pnpm lint

      # The frontend the Tauri apps ship (static export with .env.tauri).
      # Readest's check:lookbehind-regex guards its web build for old Safari;
      # the Tauri bundle has always contained lookbehind regexes, and every
      # Yohaku runtime (Chromium, WebView2, CEF, WKWebView) supports them.
      - name: build the app frontend
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: bash ../../scripts/yohaku/run-logged.sh pnpm build && pnpm check:translations

  # The jsdom unit suite is the slowest check, so it is split across two shards
  # (as upstream does); the Playwright browser tests run on shard 1.
  test:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git -c submodule."apps/readest-app/.claude/skills/gstack".update=none submodule update --init --recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        working-directory: apps/readest-app
        run: pnpm install --frozen-lockfile --prefer-offline && pnpm setup-vendors

      - name: cache playwright browsers
        if: matrix.shard == 1
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install playwright browsers
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: unit tests (shard ${{ matrix.shard }}/2)
        working-directory: apps/readest-app
        run: bash ../../scripts/yohaku/run-logged.sh pnpm test:pr:web:unit --shard=${{ matrix.shard }}/2

      - name: browser tests
        if: matrix.shard == 1
        working-directory: apps/readest-app
        run: bash ../../scripts/yohaku/run-logged.sh pnpm test:browser

  rust:
    name: Rust format, clippy and tests
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: initialize git submodules
        run: git -c submodule."apps/readest-app/.claude/skills/gstack".update=none submodule update --init --recursive

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: format check
        working-directory: apps/readest-app/src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: apps/readest-app/src-tauri
        run: bash ../../../scripts/yohaku/run-logged.sh cargo clippy -p Readest --no-deps -- -D warnings

      - name: unit tests
        working-directory: apps/readest-app/src-tauri
        run: bash ../../../scripts/yohaku/run-logged.sh cargo test -p Readest --lib
