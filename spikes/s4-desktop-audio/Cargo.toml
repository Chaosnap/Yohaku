[package]
name = "yohaku-audio-spike"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
description = "Spike S4: the core of Yohaku's desktop audio engine, tested by offline rendering"

# A standalone experiment, kept out of the app's workspace and dependency graph.
[workspace]

[features]
# Real playback through cpal (needs ALSA headers on Linux); the tests render offline.
output = ["dep:cpal"]

[dependencies]
symphonia = { version = "0.5", default-features = false, features = [
  "aac",
  "alac",
  "flac",
  "isomp4",
  "mp3",
  "ogg",
  "pcm",
  "vorbis",
  "wav",
] }
rubato = "0.15"
cpal = { version = "0.15", optional = true }

[dev-dependencies]
hound = "3.5"

[[example]]
name = "play"
required-features = ["output"]
