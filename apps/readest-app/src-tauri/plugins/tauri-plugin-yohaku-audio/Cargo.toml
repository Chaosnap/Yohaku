[package]
name = "tauri-plugin-yohaku-audio"
version = "0.1.0"
description = "Yohaku's audio: the music library and playback"
edition = "2021"
license = "AGPL-3.0"
publish = false
links = "tauri-plugin-yohaku-audio"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
lofty = "0.22"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
